<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" fill="none">
<title>A little room for curiosity</title><desc>An original editorial still life: an open notebook, a growing branch, a small orange sun, and a line that wanders from one thought to the next. Symbolic artwork, not a depiction of Jason's belongings.</desc>
