name: Anti-library progress
# The anti-library page's owner mode opens a prefilled issue with finished titles.
# Issues from the repository owner are applied to progress.json on main, then the site redeploys.
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: antilibrary-progress
  cancel-in-progress: false
jobs:
  apply:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Anti-library:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/antilibrary-progress.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
      - name: Commit and redeploy
        run: |
          git add site/antilibrary/data/progress.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898181+github-actions[bot]@users.noreply.github.com" commit -m "Update anti-library progress (#$ISSUE)"
            git push
            # A push made by this workflow does not start other workflows, so redeploy explicitly.
            gh workflow run pages.yml --ref main
          fi
          gh issue close "$ISSUE" --comment "Applied to the anti-library. The page updates once the site redeploys."
      - if: failure()
        run: gh issue comment "$ISSUE" --body "These marks could not be applied. See the workflow run for the error."
