name: Anti-library links and covers
# Looks up a public page and cover for new anti-library titles and commits the results
# to the same branch. Runs when list data changes on a feature branch, or by hand.
on:
  push:
    branches-ignore: [main]
    paths: ['site/antilibrary/data/books.json', 'site/antilibrary/data/films.json', 'site/antilibrary/data/albums.json', 'site/antilibrary/data/lists.json', 'site/antilibrary/data/lookups.json', 'scripts/antilibrary-lookup.mjs']
  workflow_dispatch:
    inputs:
      retry:
        description: Re-check titles that had no match last time
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: antilibrary-lookups-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/antilibrary-lookup.mjs ${{ inputs.retry && '--retry' || '' }}
      - name: Commit results
        run: |
          git add site/antilibrary/data
          if git diff --cached --quiet; then echo "No new links or covers."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898181+github-actions[bot]@users.noreply.github.com" commit -m "Add anti-library links and covers"
          git push
          # A push made by this workflow does not start other workflows, so redeploy main explicitly.
          if [ "$GITHUB_REF_NAME" = main ]; then gh workflow run pages.yml --ref main; fi
        env:
          GH_TOKEN: ${{ github.token }}
